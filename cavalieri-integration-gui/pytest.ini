[pytest]
testpaths = tests
pythonpath = src
addopts = -ra --strict-markers --output=test-results/unit
timeout = 120
markers =
    qs: quadrilateral-strip binding tests
    e2e: deterministic tests in a real browser
    monkey: seeded randomized browser interactions
    stress: longer numerical/performance tests
    known_bug: confirmed existing bug with a strict expected failure
